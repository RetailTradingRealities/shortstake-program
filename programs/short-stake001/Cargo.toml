[package]
name = "short-stake001"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "short_stake001"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
# Switches constants::usdc to Circle devnet USDC (see constants.rs)
devnet = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
solana-instructions-sysvar = "3.0.1"
solana-security-txt = "1.1.3"



[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-ed25519-program = "3"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-instruction = "3.5.0"
solana-pubkey = "4.3.0"
solana-account = "3"
solana-program-pack = "3"
solana-program-option = "3"
spl-token-interface = "2.0.0"
spl-associated-token-account-interface = "2.0.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
